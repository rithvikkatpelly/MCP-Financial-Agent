server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No client-side routing today, but keep the SPA fallback so deep links
    # don't 404 if routing is added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
